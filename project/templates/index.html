<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CineBase</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
    <nav>
        <strong>CINEBASE</strong>
        <ul>
            <li class="active" data-view="dashboard">Dashboard</li>
            <li data-view="movies">Top Movies</li>
            <li data-view="actors">Top Actors</li>
            <li data-view="directors">Directors</li>
            <li data-view="genres">Genres</li>
            <li data-view="admin">Admin</li>
        </ul>
    </nav>

    <main>
        <div id="search-area">
            <div id="search-box">
                <input type="text" id="main-search" placeholder="Search movies...">
                <span id="search-icon">&#128269;</span>
            </div>
        </div>

        <h2 id="current-view-name">Featured Movies</h2>
        <div id="results-container"></div>
    </main>

    <div id="auth-modal" style="display:none;">
        <div id="auth-box">
            <p><strong>Admin Access</strong></p>
            <input type="password" id="admin-password" placeholder="Enter password">
            <div id="auth-error"></div>
            <div id="auth-buttons">
                <button id="auth-submit">Enter</button>
                <button id="auth-cancel">Cancel</button>
            </div>
        </div>
    </div>

    <script src="{{ url_for('static', filename='js/main.js') }}"></script>
</body>
</html>
